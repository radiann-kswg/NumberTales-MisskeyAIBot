name: Deploy to GCP VM

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.GCP_SSH_PORT }}
          debug: true
          script: |
            set -e
            # Node.js を解決する。統合 VM（misskey-bots-unified / Debian 12）は nvm を持たず、
            # システム導入の /usr/bin/node (v22) を使う。nvm を持つ環境でも動くよう、
            # nvm.sh が存在するときだけ読み込む（無条件に `nvm use` すると exit 127 でデプロイが落ちる）。
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm use default
            fi
            # 解決できた Node.js を記録（見つからなければここで落ちる）
            node -v

            # root 所有ファイルが混在する場合に備えて所有権を修正
            sudo chown -R "$(whoami)" ~/NumberTales-MisskeyAIBot/ 2>/dev/null || true

            cd ~/NumberTales-MisskeyAIBot

            # 最新コードを取得（ローカル変更を破棄してリモートに合わせる）
            git fetch origin master
            git reset --hard origin/master
            # サブモジュールを取得。--filter=blob:none で NumberTales 以外の blob を遅延取得にする
            # （新規クローンで他作品のバイトを取得しない。git>=2.36。未対応環境はフルフェッチへフォールバック）
            git submodule update --init --recursive --filter=blob:none \
              || git submodule update --init --recursive
            # _creations-db を NumberTales 一次系（Primary/SemiPrimary）だけに sparse 間引き（冪等・新規VMで自己修復）
            bash tools/setup-creations-db-sparse.sh

            # 依存パッケージをインストール（ビルドに devDependencies が必要）
            npm install

            # TypeScript ビルド
            npm run build

            # ビルド後に devDependencies を削除して本番用に最適化
            npm prune --omit=dev

            # Bot を再起動（初回は start、以降は reload でダウンタイムなし）
            pm2 reload ecosystem.config.cjs --env production || \
              pm2 start ecosystem.config.cjs --env production

            # ステータス確認
            pm2 list
